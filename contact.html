<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact – Tastes of Africa</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <header>
    <nav aria-label="Main navigation">
      <div class="nav-inner">
        <a href="index.html" class="nav-logo">Tastes of Africa</a>
        <ul role="list">
          <li><a href="index.html">Home</a></li>
          <li><a href="recipes.html">Recipes</a></li>
          <li><a href="regions.html">Regions</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html" class="active" aria-current="page">Contact</a></li>
        </ul>
      </div>
    </nav>

    <div class="page-header">
      <h1>Get in Touch</h1>
      <p>Have a recipe to share or a question about African cuisine? We'd love to hear from you.</p>
    </div>
  </header>

  <main>
    <section class="contact-wrap" aria-labelledby="contact-heading">
      <h2 class="visually-hidden" id="contact-heading">Contact Form</h2>

      <div class="contact-card">
        <form id="contact-form" novalidate aria-label="Send us a message">

          <div class="form-group">
            <label for="name">Your Name</label>
            <input type="text" id="name" name="name" placeholder="enter your Full name" required autocomplete="name" />
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="enter your Email" required autocomplete="email" />
          </div>

          <div class="form-group">
            <label for="country">Country</label>
            <select id="country" name="country" required>
              <option value="" disabled selected>Select your country</option>
              <option value="nigeria">Nigeria</option>
              <option value="ghana">Ghana</option>
              <option value="ethiopia">Ethiopia</option>
              <option value="kenya">Kenya</option>
              <option value="morocco">Morocco</option>
              <option value="south-africa">South Africa</option>
              <option value="senegal">Senegal</option>
              <option value="tanzania">Tanzania</option>
              <option value="egypt">Egypt</option>
            </select>
          </div>

          <div class="form-group">
            <label for="message">Your Message</label>
            <textarea id="message" name="message" placeholder="Write your message here at least 20 characters" required></textarea>
          </div>

          <button type="submit" class="btn">Send Message</button>

        </form>

        <p id="confirmation" role="alert"></p>
      </div>
    </section>
  </main>

  <footer>
    <div class="footer-bottom">
      <small class="footer-copy">&copy; 2026 Tastes of Africa. Celebrating the flavours of a continent.</small>
    </div>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
